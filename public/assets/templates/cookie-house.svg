<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-label="집 쿠키 모양 도안"><rect width="210" height="297" fill="white"/><g font-family="Malgun Gothic, sans-serif" fill="#333"><text x="18" y="22" font-size="7" font-weight="700">집 쿠키 모양 도안</text><text x="18" y="34" font-size="3.6">실제 크기 100%로 인쇄하세요. 페이지에 맞춤을 끄세요.</text><text x="18" y="42" font-size="3.6">자르기와 모양 확인용 가이드입니다. 종이를 오븐에 넣지 마세요.</text><text x="18" y="50" font-size="3.6">식품 접촉에는 적합한 재질을 별도로 사용하고 위생을 지켜 주세요.</text></g><path d="M69 101 105 69 141 101 134 101 134 139 115 139 115 116 96 116 96 139 76 139 76 101Z" fill="none" stroke="#222" stroke-width=".65"/><path d="M20 176h10m-10-2v4m10-4v4" fill="none" stroke="#222" stroke-width=".4"/><text x="20" y="185" font-family="Malgun Gothic, sans-serif" font-size="3.8">이 선이 1cm인지 자로 확인하세요.</text><g font-family="Malgun Gothic, sans-serif" font-size="4" fill="#333"><text x="18" y="208">1. 1cm 검정 눈금으로 인쇄 크기를 확인합니다.</text><text x="18" y="220">2. 가위를 안전하게 사용해 바깥선을 잘라 모양을 확인합니다.</text><text x="18" y="232">3. 별도의 식품용 가이드 재질로 옮겨 반죽 모양을 잡습니다.</text><text x="18" y="244">4. 종이 가이드를 제거하고 레시피의 굽기 도구를 사용합니다.</text><text x="18" y="275" font-size="3.5">우리집 베이킹랩 직접 제작 도안 · CC0 1.0</text></g></svg>